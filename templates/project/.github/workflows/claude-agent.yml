# Agente autônomo: implementa issues com a label `ready-for-agent` e responde
# a menções @claude em issues e PRs, usando as skills de LorenzoMarty/skills.
#
# Requisitos (uma vez por repositório):
#   1. Instalar o Claude GitHub App: https://github.com/apps/claude
#   2. Secret CLAUDE_CODE_OAUTH_TOKEN (gere com `claude setup-token`)
#      ou ANTHROPIC_API_KEY (troque a linha correspondente abaixo).
name: claude-agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  implement:
    # Issue recebeu a label ready-for-agent.
    if: github.event_name == 'issues' && github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/LorenzoMarty/skills.git
          plugins: |
            workflow@lorenzo-skills
            dev@lorenzo-skills
          track_progress: true
          prompt: |
            Use a skill workflow:implement para a issue #${{ github.event.issue.number }}
            deste repositório, em modo autônomo. Termine abrindo um PR com o
            relatório do workflow:verify. Se faltar uma decisão que só um humano
            pode tomar, comente na issue, troque a label para needs-human e pare.
          claude_args: --max-turns 80

  respond:
    # Menção @claude em issue, PR ou review.
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/LorenzoMarty/skills.git
          plugins: |
            workflow@lorenzo-skills
            dev@lorenzo-skills
          claude_args: --max-turns 60
